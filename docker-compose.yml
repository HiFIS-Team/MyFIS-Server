services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myfis
      POSTGRES_USER: myfis
      POSTGRES_PASSWORD: myfis
    ports:
      - "5432:5432"
    volumes:
      - myfis-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  myfis-postgres: